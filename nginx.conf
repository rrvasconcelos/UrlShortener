events {
    worker_connections 1024;
}

http {
    upstream backend {
        # Para debug local (Visual Studio)
        server host.docker.internal:5138 backup;
        # Para container de desenvolvimento
        server backend-dev:8080;
    }

    upstream frontend {
        server frontend-dev:4200;
    }

    server {
        listen 80;
        server_name localhost;

        # URLs encurtadas - redireciona para URL original
        location ~ ^/[a-zA-Z0-9]+$ {
            proxy_pass http://backend/v1/shorten$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect off;
        }

        # API - esconde versão /v1/
        location /api/ {
            proxy_pass http://backend/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Frontend com suporte a WebSocket para hot reload
        location / {
            proxy_pass http://frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support para hot reload
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
