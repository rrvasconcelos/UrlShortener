services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - urlshortener-network

  backend-dev:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    working_dir: /app
    command: sh -c "dotnet restore && dotnet watch run --project src/UrlShortener.Api --no-launch-profile"
    ports:
      - "5000:8080"
    volumes:
      - .:/app
      - ~/.nuget/packages:/root/.nuget/packages:ro
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://*:8080
      - ConnectionStrings__Database=${DATABASE_CONNECTION_STRING}
      - Redis__ConnectionString=${REDIS_CONNECTION_STRING}
      - Hashids__Salt=${HASHIDS_SALT}
      - Hashids__MinHashLength=${HASHIDS_MIN_LENGTH}
      - DOTNET_USE_POLLING_FILE_WATCHER=true
    depends_on:
      - postgres
      - redis
    networks:
      - urlshortener-network

  frontend-dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run start"
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/UrlShortener:/app
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - urlshortener-network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend-dev
      - frontend-dev
    networks:
      - urlshortener-network

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - urlshortener-network

networks:
  urlshortener-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: